[package]
name = "sparc-desktop"
version = "0.1.0"
description = "Local desktop archive alpha for SPARC"
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
name = "sparc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
sparc = { path = "../.." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
